stops.forEach(function(d,i){

  } else {
    imgHtml = '<div class="pop-img" style="background:linear-gradient(135deg,'+bg+','+colors[i]+');display:flex;align-items:center;justify-content:center;font-size:70px"><span>'+img+'</span><span class="pop-label">'+n+' · '+tag+'</span></div>';

    (poem!='无' ? '<div class="poem">📜 '+poem+'</div>' : '') +
    '<button class="btn-read" onclick="speakText(''+

    (poem!='无'?poem.replace(/'/g,'').replace(/"/g,'').replace(/\n/g,'。'):'')+

// 绘制真实路线
var route = L.polyline(ROUTE_PTS,{
  color:'#E74C3C',weight:3.5,opacity:0.9,smoothFactor:0.5
}).addTo(map);

// 方向箭头
var arrowInt = Math.max(1, Math.floor(ROUTE_PTS.length / 30));
for(var i=0;i<ROUTE_PTS.length-arrowInt;i+=arrowInt){
  var p1=ROUTE_PTS[i],p2=ROUTE_PTS[i+Math.min(arrowInt,3)];
  var mid=[(p1[0]+p2[0])/2,(p1[1]+p2[1])/2];
  var ang=Math.atan2(p2[0]-p1[0],p2[1]-p1[1])*180/Math.PI;
  L.marker(mid,{icon:L.divIcon({html:'<div style="transform:rotate('+ang+'deg);font-size:18px;color:#E74C3C;text-shadow:0 0 6px rgba(0,0,0,0.8)">➤</div>',iconSize:[18,18],className:''}),interactive:false}).addTo(map);
}

// 起点终点
var first=ROUTE_PTS[0],last=ROUTE_PTS[ROUTE_PTS.length-1];
L.circleMarker([first[0],first[1]],{radius:8,color:'#fff',fillColor:'#27AE60',fillOpacity:1,weight:3}).addTo(map);
L.circleMarker([last[0],last[1]],{radius:8,color:'#fff',fillColor:'#27AE60',fillOpacity:1,weight:3}).addTo(map);

map.fitBounds(route.getBounds(),{padding:[60,60]});
