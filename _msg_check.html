<!-- -*- coding: utf-8 -*- -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理 -- 重走长征路</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="admin-layout">
        <div class="admin-sidebar">
            <h2>管理后台</h2>
            <a href="/admin"       class="admin-nav-item">总览</a>
            <a href="/admin/nodes"  class="admin-nav-item">节点管理</a>
            <a href="/admin/users"  class="admin-nav-item">用户管理</a>
            <a href="/admin/sparks" class="admin-nav-item">星火审核</a>
            <a href="/admin/messages" class="admin-nav-item active">留言管理</a>
            <a href="/"            class="admin-nav-item" style="margin-top:20px">返回地图</a>
        </div>

        <div class="admin-main">
            <h1>留言管理</h1>
            <p style="color:#95a5a6;margin-bottom:16px">用户留言列表</p>

            <div id="message-list">
                <div class="loading" style="text-align:center;padding:40px;color:#999">加载中...</div>
            </div>
        </div>
    </div>

    <script>
    if (!localStorage.getItem("lm_token")) { location.href = "/login"; return; }

    function loadMessages() {
        var token = localStorage.getItem("lm_token");
        fetch("/api/v1/messages?limit=500", {
            headers: { "Authorization": "Bearer " + token }
        })
        .then(function(r) { return r.json(); })
        .then(function(resp) {
            if (resp.code !== 0) return;
            var html = '<table class="admin-table"><thead><tr>';
            html += '<th>ID</th><th>内容</th><th>用户</th><th>节点</th><th>时间</th><th>操作</th>';
            html += '</tr></thead><tbody>';
            if (!resp.data || resp.data.length === 0) {
                html += '<tr><td colspan="6" class="empty" style="text-align:center;color:#999;padding:40px">暂无留言</td></tr>';
            } else {
                for (var i = 0; i < resp.data.length; i++) {
                    var msg = resp.data[i];
                    html += '<tr>';
                    html += '<td>' + msg.id + '</td>';
                    html += '<td>' + escapeHtml((msg.content || "").substring(0, 100)) + '</td>';
                    html += '<td>' + escapeHtml(msg.user_name || "匿名") + '</td>';
                    html += '<td>' + escapeHtml(msg.node_id || "-") + '</td>';
                    html += '<td>' + escapeHtml(msg.created_at || "") + '</td>';
                    html += '<td><button onclick="deleteMsg(' + msg.id + ')" class="btn-danger" style="background:#e53935;color:white;border:none;padding:4px 12px;border-radius:3px;cursor:pointer">删除</button></td>';
                    html += '</tr>';
                }
            }
            html += '</tbody></table>';
            document.getElementById("message-list").innerHTML = html;
        });
    }

    function deleteMsg(id) {
        if (!confirm("确定删除该留言？")) return;
        var token = localStorage.getItem("lm_token");
        fetch("/api/v1/messages/" + id, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        })
        .then(function(r) { return r.json(); })
        .then(function(resp) {
            if (resp.code === 0) {
                loadMessages();
            }
        });
    }

    function escapeHtml(text) {
        var d = document.createElement("div");
        d.textContent = text;
        return d.innerHTML;
    }

    loadMessages();
    </script>

    <style>
    .admin-table { width:100%; border-collapse:collapse; margin-top:16px; }
    .admin-table th, .admin-table td { padding:8px 12px; border:1px solid #ddd; text-align:left; }
    .admin-table th { background:#f5f5f5; font-weight:bold; }
    .admin-table .empty { text-align:center; color:#999; padding:40px; }
    </style>
</body>
</html>
