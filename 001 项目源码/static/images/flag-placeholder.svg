<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect width="320" height="180" rx="6" fill="#1a1a2e"/>
  <!-- 旗面 -->
  <rect x="40" y="30" width="240" height="100" rx="3" fill="#c0392b" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- 旗杆 -->
  <rect x="28" y="20" width="8" height="130" rx="3" fill="#8B4513"/>
  <!-- 五角星 -->
  <polygon points="100,60 108,84 134,84 113,100 121,126 100,110 79,126 87,100 66,84 92,84" fill="#ffd700"/>
  <!-- 文字 -->
  <text x="160" y="80" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">暂无照片</text>
  <text x="160" y="100" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="rgba(255,255,255,0.35)" text-anchor="middle">红一方面军军旗</text>
</svg>
