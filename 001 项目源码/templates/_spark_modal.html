<!-- 节点编辑器 — 共享弹窗（首页和管理后台共用同一份代码，callType 区分行为） -->
<div id="node-editor" class="modal-overlay" style="display:none">
    <div class="modal-dialog" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="node-editor-title">📝 节点编辑器</span>
            <button class="modal-close" onclick="closeNodeEditor()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="editor-tabs">
                <button class="editor-tab" data-tab="view" onclick="switchEditorTab('view')">查看节点</button>
                <button class="editor-tab" data-tab="add" onclick="switchEditorTab('add')">新增节点</button>
                <button class="editor-tab" data-tab="edit" onclick="switchEditorTab('edit')">编辑节点</button>
                <span class="current-node-bar" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#95a5a6;white-space:nowrap">
                    <span>当前节点</span>
                    <select id="node-select-existing" name="target_node_id" style="width:280px;background:#000;color:#fff;border:1px solid #555;border-radius:4px;padding:4px 8px" disabled>
                        <option value="">—— 请选择节点 ——</option>
                    </select>
                </span>
            </div>
            <form id="node-form" class="spark-form">
                <!-- 隐藏字段 -->
                <input type="hidden" name="submission_type" value="add">
                <input type="hidden" name="lat" id="node-lat" value="">
                <input type="hidden" name="lng" id="node-lng" value="">

                <!-- 节点基础字段（三个tab共用） -->
                <div id="node-fields-base" class="spark-field-group">
                    <div class="form-row">
                        <div class="form-group half">
                            <label>节点编号 <span class="required">*</span></label>
                            <input type="text" name="node_id" id="node-form-nodeid" placeholder="如 15.1" required>
                        </div>
                        <div class="form-group half">
                            <label>节点标题 <span class="required">*</span></label>
                            <input type="text" name="title" id="node-form-title" placeholder="如 四渡赤水" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label>地区 <span class="required">*</span></label>
                            <input type="text" name="location" id="node-form-location" placeholder="省/市/县" required>
                        </div>
                        <div class="form-group half">
                            <label>时间 <span class="required">*</span></label>
                            <input type="text" name="time" id="node-form-time" placeholder="1935年1月" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label>纬度</label>
                            <input type="number" name="lat_input" id="node-lat-input" step="0.000001" placeholder="点击地图选择" onclick="showLatLngPicker()">
                        </div>
                        <div class="form-group half">
                            <label>经度</label>
                            <input type="number" name="lng_input" id="node-lng-input" step="0.000001" placeholder="点击地图选择" onclick="showLatLngPicker()">
                        </div>
                    </div>
                </div>



                <!-- 共用内容字段 -->
                <div class="form-section-title">历史内容字段</div>
                <div class="form-group full">
                    <label>核心数字</label>
                    <input type="text" name="core_numbers" id="node-core_numbers" placeholder="歼敌数、人数、温度等">
                </div>
                <div class="form-group full">
                    <label>著名战役</label>
                    <textarea name="famous_battle" id="node-famous_battle" rows="3" placeholder="战役名称、时间、经过、结果"></textarea>
                </div>
                <div class="form-group full">
                    <label>重要会议</label>
                    <textarea name="important_meeting" id="node-important_meeting" rows="3" placeholder="会议名称、时间、地点、决议"></textarea>
                </div>
                <div class="form-group full">
                    <label>历史事件 <span class="suggested">*建议</span></label>
                    <textarea name="history_event" id="node-history_event" rows="3" placeholder="核心事件描述"></textarea>
                </div>
                <div class="form-group full">
                    <label>核心遗址 <span class="suggested">*建议</span></label>
                    <textarea name="core_site" id="node-core_site" rows="3" placeholder="纪念馆、纪念碑、旧址等"></textarea>
                </div>
                <div class="form-group full">
                    <label>诗词文章</label>
                    <textarea name="poem_article" id="node-poem_article" rows="3" placeholder="相关诗词全文"></textarea>
                </div>
                <div class="form-group full">
                    <label>典型故事</label>
                    <textarea name="typical_story" id="node-typical_story" rows="3" placeholder="感人故事"></textarea>
                </div>
                <div class="form-group full">
                    <label>典型人物</label>
                    <textarea name="typical_people" id="node-typical_people" rows="3" placeholder="关键人物及其贡献"></textarea>
                </div>
                <div class="form-group full">
                    <label>历史意义 <span class="suggested">*建议</span></label>
                    <textarea name="historical_significance" id="node-historical_significance" rows="3" placeholder="历史地位与影响"></textarea>
                </div>

                <!-- 多媒体资源 — 所有模式显示，查看模式不带上传 -->
                <div id="node-multimedia-section">
                    <div class="form-section-title">多媒体资源</div>
                    <div id="node-existing-media" style="display:none;margin-bottom:12px;padding:8px;background:rgba(255,255,255,0.03);border-radius:8px">
                        <div style="font-size:12px;color:#95a5a6;margin-bottom:6px">已关联多媒体：</div>
                        <div id="node-existing-media-list"></div>
                    </div>
                    <div id="node-upload-fields">
                        <div class="form-row">
                            <div class="form-group half">
                                <label>上传图片</label>
                                <input type="file" name="images" accept="image/*" multiple>
                            </div>
                            <div class="form-group half">
                                <label>上传视频</label>
                                <input type="file" name="videos" accept="video/*">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group half">
                                <label>上传音频</label>
                                <input type="file" name="audios" accept="audio/*">
                            </div>
                            <div class="form-group half">
                                <label>上传文档</label>
                                <input type="file" name="documents" accept=".pdf,.doc,.docx,.txt">
                            </div>
                        </div>
                        <div class="form-group full" id="node-submitter-info">
                            <label>上传者信息</label>
                            <div class="form-row">
                                <div class="form-group half">
                                    <input type="text" name="submitter_name" placeholder="姓名（选填）">
                                </div>
                                <div class="form-group half">
                                    <input type="text" name="submitter_phone" placeholder="电话（选填）">
                                </div>
                            </div>
                            <input type="text" name="source" placeholder="来源/出处说明（选填）">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeNodeEditor()">取消</button>
                    <button type="submit" class="btn btn-primary" id="node-submit-btn">提交</button>
                </div>
                <div id="node-submit-status" class="form-status"></div>
            </form>
        </div>
    </div>
</div>
