<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我走长征路 — 交互式长征文化数字平台</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ===================================================================
         加载封面
         =================================================================== -->
    <div id="loading-overlay">
        <div class="loading-title">我 走 长 征 路</div>
        <div class="loading-spinner"></div>
        <div style="margin-top:16px;color:#95a5a6;font-size:12px">正在加载长征文化数字地图...</div>
    </div>

    <!-- ===================================================================
         主应用容器
         =================================================================== -->
    <div id="app">
        <!-- 地图容器 -->
        <div id="map"></div>

        <!-- 顶部标题栏 -->
        <!-- 左上角：Logo + 标题（V003 §4.1） -->
        <div id="title-bar">
            <h1>我 走 长 征 路</h1>
            <div class="subtitle">交互式长征文化数字平台 · 2026</div>
        </div>

        <!-- 军队选择器 -->
        <div id="army-selector">
            <div class="army-list">
                <div class="army-item active" data-army="1" onclick="selectArmy(1)">
                    <span class="army-dot" style="background:#c0392b"></span>中央红军（红一方面军）
                </div>
                <div class="army-item" data-army="2" onclick="selectArmy(2)">
                    <span class="army-dot" style="background:#27ae60"></span>红二方面军
                </div>
                <div class="army-item" data-army="4" onclick="selectArmy(4)">
                    <span class="army-dot" style="background:#2980b9"></span>红四方面军
                </div>
                <div class="army-item" data-army="25" onclick="selectArmy(25)">
                    <span class="army-dot" style="background:#8e44ad"></span>红二十五军
                </div>
            </div>
        </div>

        <!-- 自动漫游状态栏 -->
        <div id="autowalk-status">
            <span class="army-name">长征路线</span>
            <div class="progress-bar-wrap">
                <div class="progress-bar" style="width:0%"></div>
            </div>
            <span class="segment-info">0 / 0</span>
            <span class="current-title" style="margin-left:8px;color:#95a5a6;font-size:12px"></span>
            <button class="btn-stop" onclick="stopAutowalk()">停止</button>
        </div>

        <!-- 右侧节点信息面板 -->
        <div id="info-panel">
            <div class="panel-header">
                <div>
                    <div class="node-title" id="panel-title">—</div>
                    <div class="node-meta" id="panel-meta">—</div>
                </div>
                <button class="btn-close" id="btn-close-panel" onclick="closeNodePanel()">×</button>
            </div>
            <div class="panel-image" id="panel-image">
                <!-- 节点图片 -->
            </div>
            <div class="panel-body" id="panel-body">
                <!-- 动态内容 -->
            </div>
            <div class="panel-footer">
                <button class="btn-read" id="btn-read" onclick="readCurrentContent()">🔊 朗读</button>
                <button class="btn-spark" id="btn-spark" onclick="openSparkForm()">✦ 星火投稿</button>
            </div>

        </div>

        <!-- 留言板 -->
        <div id="message-board">
            <div class="msg-header">
                <h3>📝 留言板</h3>
                <button class="msg-close" onclick="closeMessageBoard()" title="关闭留言板">✕</button>
            </div>
            <div class="message-list">
                <!-- 动态内容 -->
            </div>
            <div class="message-input-row">
                <input type="text" placeholder="说点什么..." id="msg-input"
                    onkeydown="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>

        <!-- 右侧控制栏（V003 §4.1：右侧纵向排列，7个功能按钮） -->
        <div id="controls">
            <button class="ctrl-btn" id="btn-tts" title="打开/关闭语音播报">
                <span class="icon">🔊</span>
                <span class="label">语音</span>
            </button>
            <div class="ctrl-divider"></div>
            <button class="ctrl-btn" id="btn-autowalk" title="自动漫游模式">
                <span class="icon">🚶</span>
                <span class="label" id="autowalk-label">漫游</span>
            </button>
            <div class="ctrl-divider"></div>
            <button class="ctrl-btn" id="btn-army" title="选择军队路线">
                <span class="icon">⚑</span>
                <span class="label">军队</span>
            </button>
            <div class="ctrl-divider"></div>
            <button class="ctrl-btn" id="btn-spark-main" title="星火拾遗 — 提交你的长征记忆">
                <span class="icon">✦</span>
                <span class="label">星火</span>
            </button>
            <button class="ctrl-btn" id="btn-basemap" title="切换卫星/普通地图">
                <span class="icon">🗺</span>
                <span class="label">卫星</span>
            </button>
            <div class="ctrl-divider"></div>
            <button class="ctrl-btn" id="btn-message" title="用户留言评论">
                <span class="icon">💬</span>
                <span class="label">留言</span>
            </button>
            <button class="ctrl-btn" id="btn-login" title="用户登录"
                onclick="location.href='/login'">
                <span class="icon">👤</span>
                <span class="label">登录</span>
            </button>
            <button class="ctrl-btn" id="btn-admin" title="管理后台"
                onclick="location.href='/admin'" style="display:none">
                <span class="icon">⚙</span>
                <span class="label">管理</span>
            </button>
        </div>

        <!-- 速度选择弹出面板（向左弹出） -->
        <div id="speed-selector" class="popout-panel">
            <div class="popout-arrow-right"></div>
            <div class="speed-label">节点间移动速度</div>
            <button class="speed-btn active" data-speed="3" onclick="selectAutowalkSpeed(3)">慢速 3s</button>
            <button class="speed-btn" data-speed="2" onclick="selectAutowalkSpeed(2)">中速 2s</button>
            <button class="speed-btn" data-speed="1" onclick="selectAutowalkSpeed(1)">快速 1s</button>
            <button class="speed-start-btn" id="btn-autowalk-start" onclick="startAutowalk()" disabled>开始</button>
        </div>

        <!-- 播放控制弹出面板（向左弹出） -->
        <div id="play-controls" class="popout-panel">
            <div class="popout-arrow-right"></div>
            <button class="ctrl-btn" id="btn-play-pause" title="暂停/继续">
                <span class="icon">⏸</span>
                <span class="label">暂停</span>
            </button>
            <button class="ctrl-btn" id="btn-skip" title="跳至下一节点">
                <span class="icon">⏭</span>
                <span class="label">跳过</span>
            </button>
            <button class="ctrl-btn" id="btn-restart" title="重头开始">
                <span class="icon">⏮</span>
                <span class="label">重头</span>
            </button>
            <button class="ctrl-btn" id="btn-exit-autowalk" title="退出漫游">
                <span class="icon">✕</span>
                <span class="label">退出</span>
            </button>
        </div>
    </div>

    <!-- 星火弹窗 -->
    <div id="spark-modal" class="modal-overlay" style="display:none">
        <div class="modal-dialog" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title">⭐ 星火拾遗 — 提交您的长征记忆</span>
                <button class="modal-close" onclick="closeSparkForm()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="spark-tabs">
                    <button class="spark-tab active" data-tab="new-node" onclick="switchSparkTab('new-node')">新建节点</button>
                    <button class="spark-tab" data-tab="update-node" onclick="switchSparkTab('update-node')">补充既有节点</button>
                </div>
                <form id="spark-form" class="spark-form">
                    <!-- 隐藏字段 -->
                    <input type="hidden" name="submission_type" value="new-node">
                    <input type="hidden" name="lat" id="spark-lat" value="">
                    <input type="hidden" name="lng" id="spark-lng" value="">

                    <!-- 新建节点字段组 -->
                    <div id="spark-fields-new" class="spark-field-group">
                        <div class="form-row">
                            <div class="form-group half">
                                <label>节点编号 <span class="required">*</span></label>
                                <input type="text" name="node_id" placeholder="如 15.1" required>
                            </div>
                            <div class="form-group half">
                                <label>节点标题 <span class="required">*</span></label>
                                <input type="text" name="title" placeholder="如 四渡赤水" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group half">
                                <label>地区 <span class="required">*</span></label>
                                <input type="text" name="location" placeholder="省/市/县" required>
                            </div>
                            <div class="form-group half">
                                <label>时间 <span class="required">*</span></label>
                                <input type="text" name="time" placeholder="1935年1月" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group half">
                                <label>纬度</label>
                                <input type="number" name="lat_input" id="spark-lat-input" step="0.000001" placeholder="点击地图选择" onclick="showLatLngPicker()">
                            </div>
                            <div class="form-group half">
                                <label>经度</label>
                                <input type="number" name="lng_input" id="spark-lng-input" step="0.000001" placeholder="点击地图选择" onclick="showLatLngPicker()">
                            </div>
                        </div>
                    </div>

                    <!-- 补充既有节点字段组 -->
                    <div id="spark-fields-update" class="spark-field-group" style="display:none">
                        <div class="form-group full">
                            <label>选择节点 <span class="required">*</span></label>
                            <select name="target_node_id" id="spark-node-select" required>
                                <option value="">—— 请选择节点 ——</option>
                            </select>
                        </div>
                    </div>

                    <!-- 共用内容字段 -->
                    <div class="form-section-title">历史内容字段</div>
                    <div class="form-group full">
                        <label>核心数字</label>
                        <input type="text" name="core_numbers" placeholder="歼敌数、人数、温度等">
                    </div>
                    <div class="form-group full">
                        <label>著名战役</label>
                        <textarea name="famous_battle" rows="3" placeholder="战役名称、时间、经过、结果"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>重要会议</label>
                        <textarea name="important_meeting" rows="3" placeholder="会议名称、时间、地点、决议"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>历史事件 <span class="suggested">*建议</span></label>
                        <textarea name="history_event" rows="3" placeholder="核心事件描述"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>核心遗址 <span class="suggested">*建议</span></label>
                        <textarea name="core_site" rows="3" placeholder="纪念馆、纪念碑、旧址等"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>诗词文章</label>
                        <textarea name="poem_article" rows="3" placeholder="相关诗词全文"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>典型故事</label>
                        <textarea name="typical_story" rows="3" placeholder="感人故事"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>典型人物</label>
                        <textarea name="typical_people" rows="3" placeholder="关键人物及其贡献"></textarea>
                    </div>
                    <div class="form-group full">
                        <label>历史意义 <span class="suggested">*建议</span></label>
                        <textarea name="historical_significance" rows="3" placeholder="历史地位与影响"></textarea>
                    </div>

                    <div class="form-section-title">多媒体资源</div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label>上传图片</label>
                            <input type="file" name="images" accept="image/*" multiple>
                        </div>
                        <div class="form-group half">
                            <label>上传视频</label>
                            <input type="file" name="videos" accept="video/*">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label>上传音频</label>
                            <input type="file" name="audios" accept="audio/*">
                        </div>
                        <div class="form-group half">
                            <label>上传文档</label>
                            <input type="file" name="documents" accept=".pdf,.doc,.docx,.txt">
                        </div>
                    </div>
                    <div class="form-group full">
                        <label>上传者信息</label>
                        <div class="form-row">
                            <div class="form-group half">
                                <input type="text" name="submitter_name" placeholder="姓名（选填）">
                            </div>
                            <div class="form-group half">
                                <input type="text" name="submitter_phone" placeholder="电话（选填）">
                            </div>
                        </div>
                        <input type="text" name="source" placeholder="来源/出处说明（选填）">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-cancel" onclick="closeSparkForm()">取消</button>
                        <button type="submit" class="btn btn-primary">提交审核</button>
                    </div>
                    <div id="spark-submit-status" class="form-status"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <!-- 应用 JS -->
    <script src="/static/js/map.js"></script>
    <script src="/static/js/nodes.js"></script>
    <script src="/static/js/controls.js"></script>
    <script src="/static/js/spark.js"></script>
    <script src="/static/js/auth.js"></script>

    <script>
    /**
     * @brief 应用初始化入口
     */
    (function() {
        "use strict";

        // 初始化地图
        initMap();

        // 初始化控制栏
        initControls();

        // 初始化认证状态
        initAuth().then(() => {
            // 根据用户角色显示管理后台入口
            if (window.currentUser && ["admin", "super"].includes(window.currentUser.role)) {
                document.getElementById("btn-admin").style.display = "";
            }
        });

        // 隐藏加载封面
        window.addEventListener("load", () => {
            setTimeout(() => {
                const overlay = document.getElementById("loading-overlay");
                if (overlay) {
                    overlay.classList.add("fade-out");
                    setTimeout(() => overlay.remove(), 700);
                }
            }, 800);
        });

        // 键盘快捷键
        document.addEventListener("keydown", (e) => {
            // ESC 关闭面板
            if (e.key === "Escape") {
                closeNodePanel();
                document.getElementById("message-board")?.classList.remove("visible");
                document.getElementById("army-selector")?.classList.remove("visible");
            }
            // 左右方向键切换步骤
            if (document.getElementById("info-panel").classList.contains("visible")) {
                if (e.key === "ArrowRight") nextStep();
                if (e.key === "ArrowLeft")  prevStep();
            }
        });

        console.log("[App] 长征文化数字地图初始化完成");
    })();
    </script>
</body>
</html>
