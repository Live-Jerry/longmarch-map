<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 — 我走长征路</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <h2>注 册</h2>
        <div class="auth-subtitle">加入长征文化数字地图，参与星火拾遗</div>

        <div class="error-msg" id="error-msg"></div>

        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="至少 3 个字符"
                       required minlength="3" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="至少 6 个字符"
                       required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="password2" placeholder="再次输入密码"
                       required autocomplete="new-password">
            </div>
            <button type="submit" class="auth-submit">注 册</button>
        </form>

        <div class="auth-alt-link">
            已有账号？<a href="/login">立即登录</a>
        </div>
        <div class="auth-alt-link" style="margin-top:8px">
            <a href="/">← 返回地图</a>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
    async function handleRegister(e) {
        e.preventDefault();
        const username  = document.getElementById("username").value.trim();
        const password  = document.getElementById("password").value;
        const password2 = document.getElementById("password2").value;
        const errorEl   = document.getElementById("error-msg");

        if (password !== password2) {
            errorEl.textContent = "两次输入的密码不一致";
            errorEl.style.display = "block";
            return;
        }

        const result = await register(username, password);

        if (result.success) {
            location.href = "/";
        } else {
            errorEl.textContent = result.message;
            errorEl.style.display = "block";
        }
    }
    </script>
</body>
</html>
