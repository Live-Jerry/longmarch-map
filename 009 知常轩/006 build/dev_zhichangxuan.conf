# Nginx configuration for dev.zhichangxuan.com (test environment).
# 长征 dev: 端口 5001 | 知常轩测试: /zcx/ 前缀 → 端口 5003
server {
    if ($host = dev.zhichangxuan.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name dev.zhichangxuan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }


}

server {
    listen 443 ssl http2;
    server_name dev.zhichangxuan.com;
    ssl_certificate /etc/letsencrypt/live/zhichangxuan.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zhichangxuan.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # 知常轩测试版（/zcx/ 前缀，前缀保留给 Flask 处理）
    location /zcx/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 知常轩静态资源（也带前缀）
    location /zcx/static/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        alias "/opt/longmarch-dev/001 项目源码/static/";
        expires 0;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(db|sqlite|log|pyc)$ {
        deny all;
    }

}
