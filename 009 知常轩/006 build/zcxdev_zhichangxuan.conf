# Nginx configuration for zcxdev.zhichangxuan.com (知常轩测试环境)
# 知常轩测试: 端口 5003（根路径，无前缀）
server {
    listen 80;
    server_name zcxdev.zhichangxuan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name zcxdev.zhichangxuan.com;

    ssl_certificate /etc/letsencrypt/live/zhichangxuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhichangxuan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        alias "/opt/zhichangxuan-dev/001 项目源码/static/";
        expires 0;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(db|sqlite|log|pyc)$ {
        deny all;
    }
}
