# Nginx configuration for dev.zhichangxuan.com (test environment).
# Reverse proxy for Gunicorn on port 5001.
server {
    listen 80;
    server_name dev.zhichangxuan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.zhichangxuan.com;

    ssl_certificate /etc/letsencrypt/live/zhichangxuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhichangxuan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /static/ {
        alias "/opt/longmarch-dev/001 项目源码/static/";
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(db|sqlite|log|pyc)$ {
        deny all;
    }
}
